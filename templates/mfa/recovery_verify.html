{% extends "base.html" %}

{% block title %}Recovery code &middot; MFA Security App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Përdor një recovery code</h1>
                <p class="text-body-secondary small mb-4">
                    Fut një nga kodet që ruajte kur aktivizove MFA. Çdo kod vlen vetëm një herë.
                </p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    <label for="{{ form.code.id_for_label }}" class="form-label">{{ form.code.label }}</label>
                    {{ form.code }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Verifiko</button>
                </form>

                <p class="text-center small mt-3 mb-0">
                    <a href="{% url 'mfa:verify' %}">Kthehu te kodi i authenticator-it</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
